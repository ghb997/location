name: Locus
options:
  bundleIdPrefix: com.ghb997
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  # Icon Composer packages must be treated as a single file, not exploded.
  fileTypes:
    icon:
      file: true
settings:
  base:
    # Set your Apple Developer Team ID to build from source (see README).
    DEVELOPMENT_TEAM: ""
    LOCUS_APP_BUNDLE_ID: com.ghb997.location
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Locus:
    type: application
    platform: iOS
    sources:
      - path: Locus
        excludes:
          - "**/Info.plist"
      - path: AppIcon.icon
      - path: Vendor/idevice/module.modulemap
        buildPhase: none
      - path: Vendor/idevice/idevice.h
        buildPhase: none
      - path: Vendor/LocalDevVPN/LocalDevVPN-LICENSE.txt
        buildPhase: resources
      - path: Vendor/LocalDevVPN/LocalDevVPN-Attribution.txt
        buildPhase: resources
    dependencies:
      - target: TunnelProvider
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOCUS_APP_BUNDLE_ID)"
        PRODUCT_NAME: location
        INFOPLIST_FILE: Locus/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Locus/Resources/Locus.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/idevice"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lidevice_ffi"
          - "-lc++"
          - "-lz"
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/idevice"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""
  TunnelProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: TunnelProvider
        excludes:
          - Info.plist
          - TunnelProvider.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(LOCUS_APP_BUNDLE_ID).TunnelProvider"
        PRODUCT_NAME: TunnelProvider
        INFOPLIST_FILE: TunnelProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: TunnelProvider/TunnelProvider.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
